[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bliptrace"
version = "1.0.0"
description = "Runtime Python SDK for the Bliptrace error-capture platform"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Developers Hub Sdn Bhd" }]
keywords = ["bliptrace", "error", "observability", "monitoring", "telemetry"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://scope.g8suite.com"
Repository = "https://github.com/bliptrace/bliptrace-python"

[tool.setuptools.packages.find]
include = ["bliptrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
