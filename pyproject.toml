[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "g8scope"
version = "1.0.0"
description = "Runtime Python SDK for the g8scope error-capture platform"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Developers Hub Sdn Bhd" }]
keywords = ["g8scope", "error", "observability", "monitoring", "telemetry"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://scope.g8suite.com"
Repository = "https://github.com/developers-hub-my/g8scope-python"

[tool.setuptools.packages.find]
include = ["g8scope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
